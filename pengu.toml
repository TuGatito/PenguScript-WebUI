[project]
name = "PenguScript-WebUI"
version = "0.1.0"
entry = "pengu/webui.d.pengu"
output = "c"
output_name = "webui"

[build]
src_dir = "pengu"
lib_dir = "lib"
include_dir = "include"
c_dir = "c"
build_dir = "build"
includes = []
links = []
lib_dirs = []
include_dirs = []
cflags = ["-Wall", "-std=c11"]
ldflags = []
defines = []
cc = "gcc"

[assets]
dir = "assets"
module = "arca"
embed = true

[dependencies]

[profiles.debug]
cflags = ["-g", "-O0", "-Wall"]
defines = ["DEBUG"]

[profiles.release]
cflags = ["-O3", "-DNDEBUG", "-ffunction-sections", "-fdata-sections"]
defines = ["NDEBUG"]

[profiles.small]
cflags = ["-Os", "-DNDEBUG", "-ffunction-sections", "-fdata-sections",
          "-fno-asynchronous-unwind-tables", "-fno-unwind-tables",
          "-fno-ident", "-fno-plt"]
defines = ["NDEBUG", "PENGU_SIZE_OPT"]
